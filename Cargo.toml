[package]
name="ninja-rs"
version="0.1.0"
edition="2024"


[lib]
crate-type = ["staticlib","rlib"] # This generates a .lib file on Windows

[profile.dev]
opt-level= 3
debug=true
strip=false

[target.'cfg(target_os="windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming", # For RtlSetCurrentDirectory_U
    "Win32_Foundation",               # For NTSTATUS codes and basic types
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Security"


]

[build-dependencies]
embed-resource = "3.0.9"
cc = "1.0"
find-msvc-tools = "0.1"

[dependencies]
atty = "0.2.14"
clap = { version = "4.6.1", features = ["derive"] }
find-msvc-tools = "0.1"
memmap2 = "0.9.10"
rkyv = "0.8.16"
terminal_size = "0.4.4"
tracing = "0.1.44"
rand = "0.10.1"

#[dev-dependencies]
